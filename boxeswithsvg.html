<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>animationusingsvg</title>
  </head>
  <body>
    <svg width="700" height="500" viewBox="0 0 500 500">
      <rect
        x="50"
        y="50"
        width="400"
        height="400"
        fill="none"
        stroke="black"
        stroke-width="4"
      />

      <rect x="50" y="50" width="400" height="200" fill="blue" />

      <rect x="50" y="250" width="400" height="200" fill="green" />

      <line
        x1="175"
        y1="175"
        x2="325"
        y2="175"
        stroke="black"
        stroke-width="4"
      />

      <line
        x1="175"
        y1="175"
        x2="175"
        y2="325"
        stroke="black"
        stroke-width="4"
      />

      <line
        x1="325"
        y1="175"
        x2="325"
        y2="325"
        stroke="black"
        stroke-width="4"
      />
    </svg>
  </body>
</html>
