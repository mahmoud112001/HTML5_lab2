<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mathml + svg triangle</title>
  </head>
  <body>
    <svg width="300" height="400" viewBox="0 0 300 400">
      <polygon
        points="80,350 180,350 180,80"
        fill="red"
        stroke="black"
        stroke-width="2"
      />

      <text x="120" y="370" font-size="18">a</text>
      <text x="190" y="220" font-size="18">b</text>
      <text x="115" y="200" font-size="18">c</text>
    </svg>

    <br /><br />
    <h1>according to pythagoras theorem</h1>
    <br /><br />

    <math mathcolor="red">
      <mrow>
        <mi>c</mi>

        <mo>=</mo>
        <msqrt>
          <msup>
            <mi>a</mi>
            <mn>2</mn>
          </msup>
          <mo>+</mo>
          <msup>
            <mi>b</mi>
            <mn>2</mn>
          </msup>
        </msqrt>
      </mrow>
    </math>
  </body>
</html>
