<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nshape</title>
  </head>
  <body>
    <canvas id="c" width="500" height="500"></canvas>

    <script>
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const cx = 250;
      const cy = 250;

/*1) Conic Gradient (Outer Circle)*/
      let conic = ctx.createConicGradient(0, cx, cy);
      conic.addColorStop(0, "#0d2c92");
      conic.addColorStop(0.25, "#3b82f6");
      conic.addColorStop(0.5, "#1e40af");
      conic.addColorStop(0.75, "#60a5fa");
      conic.addColorStop(1, "#1e40af");

      ctx.beginPath();
      ctx.arc(cx, cy, 200, 0, Math.PI * 2);
      ctx.fillStyle = conic;
      ctx.fill();

/*2) Radial Gradient (Inner Circle)*/
      let radial = ctx.createRadialGradient(cx, cy, 20, cx, cy, 160);
      radial.addColorStop(0, "lightblue");
      radial.addColorStop(0.7, "blue");
      radial.addColorStop(1, "white");

      ctx.beginPath();
      ctx.arc(cx, cy, 160, 0, Math.PI * 2);
      ctx.fillStyle = radial;
      ctx.fill();

/*3) Letter N*/
      ctx.fillStyle = "white";
      ctx.font = "bold 220px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("N", cx, cy);
    </script>
  </body>
</html>
